name: Deploy para a hospedagem

# Roda a cada push na main e tambem manualmente pelo botao "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Impede que dois deploys rodem ao mesmo tempo e embaralhem os arquivos no servidor.
# cancel-in-progress fica FALSE de propósito: cancelar um deploy no meio do envio
# deixa o servidor com metade dos arquivos — um index.html novo apontando para
# assets que ainda não subiram derruba o site. Enfileirar é mais lento e seguro.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

# O GITHUB_TOKEN deste job só precisa clonar o repositório. Sem este bloco ele
# herda o padrão da conta, que em repositório antigo ainda pode ser escrita em
# tudo — e aí uma ação de terceiro comprometida não levaria só as credenciais de
# FTP, levaria junto a permissão de escrever no próprio repositório.
permissions:
  contents: read

jobs:
  build-e-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de producao
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      # Falha cedo se o build nao gerou o index.html, em vez de subir uma pasta vazia
      # e derrubar o site no ar.
      - name: Conferir se o build gerou os arquivos
        run: test -f dist/index.html && test -f dist/.htaccess

      # Fixada no commit, não na tag. Tag do git é ponteiro móvel: quem tomar a
      # conta do autor reaponta v4.3.5 para código próprio, e na execução
      # seguinte esse código roda aqui com FTP_SERVER, FTP_USERNAME e
      # FTP_PASSWORD no ambiente — ou seja, com escrita no servidor da casa. Foi
      # exatamente assim que a tj-actions/changed-files vazou segredo de milhares
      # de repositórios em 2025. O SHA abaixo é a v4.3.5 e não muda sozinho.
      # Para atualizar: leia o SHA novo da tag desejada e troque aqui.
      - name: Enviar para a hospedagem por FTPS
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ./
          # Envia apenas o que mudou. Nunca apaga a pasta inteira antes de subir,
          # entao um deploy interrompido nao deixa o site fora do ar.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
