<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-familia-grill.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121110" />
    <title>Família Grill & Sushi — Churras, Burger e Sushi em Niterói</title>
    <meta
      name="description"
      content="Churrasco na brasa, hambúrguer na chapa e sushi artesanal na Av. Tamandaré, 389, Niterói. Todo dia: pedido a partir das 17h30, salão das 18h às 2h."
    />
    <!--
      O host canônico é o apex, familiagrill.com.br — o mesmo que brand.site em
      src/data/site.ts. O www redireciona para cá na Vercel; nenhuma URL abaixo
      leva www, senão o canonical aponta para um redirecionamento.
      O alias familiagrillbr.vercel.app continua servindo o site, mas não é
      endereço público: não use em canonical, og: nem JSON-LD.
    -->
    <link rel="canonical" href="https://familiagrill.com.br/" />
    <meta property="og:title" content="Família Grill & Sushi" />
    <meta
      property="og:description"
      content="Churras, Burger & Sushi artesanal — Niterói. Todo dia até as 2h da manhã."
    />
    <meta property="og:image" content="https://familiagrill.com.br/logo-familia-grill.png" />
    <meta property="og:url" content="https://familiagrill.com.br/" />
    <!-- "restaurant" não é tipo válido de Open Graph; scrapers caíam para o
         padrão de qualquer jeito. O tipo do lugar é dito no JSON-LD abaixo. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />

    <!--
      Dados estruturados para Google Maps e buscadores. Espelha src/data/site.ts,
      assim como a migration do Supabase espelha o horário do salão: mudou o
      expediente ou o endereço lá, mude aqui.
      Sem bairro e sem CEP de propósito — nunca foram confirmados com a casa.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Restaurant",
        "name": "Família Grill & Sushi",
        "description": "Churrasco na brasa, hambúrguer na chapa e sushi artesanal em Niterói.",
        "url": "https://familiagrill.com.br/",
        "logo": "https://familiagrill.com.br/logo-familia-grill.png",
        "image": "https://familiagrill.com.br/fotos/churrasco.jpg",
        "telephone": "+5521997447808",
        "servesCuisine": ["Churrasco", "Hambúrguer", "Sushi"],
        "menu": "https://shop.beetech.com.br/churrascofamiliagrill",
        "acceptsReservations": true,
        "sameAs": ["https://www.instagram.com/churrascofamiliagrill/"],
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Av. Tamandaré, 389",
          "addressLocality": "Niterói",
          "addressRegion": "RJ",
          "addressCountry": "BR"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday",
              "Sunday"
            ],
            "opens": "18:00",
            "closes": "02:00"
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Cinzel:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
