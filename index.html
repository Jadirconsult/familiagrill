<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-familia-grill.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121110" />

    <!--
      A classe `js` sai daqui, e não mais de main.tsx, por causa da
      pré-renderização: o index.html publicado já vem com a página inteira
      escrita dentro do #root. Se a classe só chegasse na execução do módulo, o
      navegador pintaria esse conteúdo visível por um quadro e o esconderia em
      seguida — html.js .reveal tem opacity: 0 —, fazendo a página piscar antes
      de a animação de entrada começar. Script em linha no head roda antes da
      primeira pintura, então o comportamento visual fica idêntico ao de sempre.

      O timer é a rede de segurança que index.css exige em texto: se o módulo
      não montar (script bloqueado, erro de rede, navegador antigo), a classe
      cai e o conteúdo pré-renderizado aparece. Sem ele, uma falha de script
      entregaria página em branco, que é justamente o que aquele comentário
      manda evitar.
    -->
    <script>
      document.documentElement.classList.add('js')
      setTimeout(function () {
        if (document.documentElement.dataset.montado !== '1') {
          document.documentElement.classList.remove('js')
        }
      }, 4000)
    </script>

    <!-- seo:inicio -->
    <!--
      Tudo entre estes dois marcadores é REESCRITO no build por
      scripts/seo-build.mjs, a partir de src/data/site.ts. O que fica aqui é o
      que o servidor de desenvolvimento mostra, e o ponto de partida do
      gerador — mudar horário, endereço ou cardápio se faz em site.ts.

      Havia três cópias do expediente da casa no repositório: site.ts, este
      arquivo e a migration do Supabase. As duas primeiras agora são uma só,
      e o comentário que explicava como mantê-las sincronizadas à mão foi
      para o gerador, junto com a regra do host canônico.
    -->
    <title>Família Grill & Sushi — Churras, Burger e Sushi em Niterói</title>
    <meta
      name="description"
      content="Churrasco na brasa, hambúrguer na chapa e sushi artesanal na Av. Tamandaré, 389, Niterói. Todo dia: pedido a partir das 17h30, salão das 18h às 2h."
    />
    <link rel="canonical" href="https://www.familiagrill.com.br/" />
    <!-- seo:fim -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Cinzel:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
